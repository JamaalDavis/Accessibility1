<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title | default: 'Inclusive Prototype' }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

  <!-- Skip link: first focusable element; reveals on :focus-visible -->
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="container header-inner">

      <a href="{{ '/' | relative_url }}" class="site-brand">
        {{ site.title | default: 'Inclusive Prototype' }}
      </a>

      <!--
        Mobile toggle: aria-expanded reflects open/closed state.
        aria-controls points to the nav list id.
        Label text updated via JS to match state.
      -->
      <button
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="primary-nav-list"
        aria-label="Open navigation menu"
      >
        <span class="hamburger" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>

      <nav class="primary-nav" aria-label="Primary">
        <ul id="primary-nav-list" class="nav-list" role="list">
          <li>
            <a
              href="{{ '/' | relative_url }}"
              {% if page.url == '/' %}aria-current="page"{% endif %}
            >Home</a>
          </li>
          <li>
            <a href="#wcag-section">WCAG 2.2</a>
          </li>
          <li>
            <a href="#contact-section">Contact</a>
          </li>
        </ul>
      </nav>

    </div>
  </header>

  <!--
    tabindex="-1" allows programmatic focus after skip-link activation.
    id="main-content" is the skip-link target.
  -->
  <main id="main-content" tabindex="-1">
    {{ content }}
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <p class="footer-copy">
        Built with semantic HTML · WCAG 2.2 AA compliant ·
        <a href="https://www.w3.org/WAI/WCAG22/quickref/" class="footer-link">WCAG Quick Reference</a>
      </p>
    </div>
  </footer>

  <script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/form.js' | relative_url }}" defer></script>
</body>
</html>
